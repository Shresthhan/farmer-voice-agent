version: "3.9"

services:
  # Local LLM brain - runs llama3.2 for chat + function calling
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"        # exposes Ollama's API to your FastAPI app
    volumes:
      - ollama_data:/root/.ollama   # persists downloaded models between restarts

  # Local text-to-speech engine
  piper:
    image: rhasspy/wyoming-piper:latest
    command: --voice en_US-lessac-medium   # sets the voice model to use
    ports:
      - "10200:10200"

  # Local database - stores farmer sessions and collected data
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: farmerdemo
      POSTGRES_DB: farmerdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data   # persists DB data between restarts

  # Your FastAPI backend - ties STT, LLM, TTS, and DB together
  api:
    build: ./app          # builds using app/Dockerfile
    ports:
      - "8000:8000"        # your app is reachable at localhost:8000
    depends_on:
      - ollama
      - piper
      - db
    env_file:
      - .env               # loads DATABASE_URL, OLLAMA_HOST, PIPER_HOST

volumes:
  ollama_data:    # named volume so Ollama models survive container restarts
  pg_data:        # named volume so database survives container restarts